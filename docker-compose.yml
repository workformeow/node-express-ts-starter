# Run the app locally in Docker: `docker compose up -d --build`
services:
  api:
    build: .
    image: node-starter
    container_name: node-starter
    restart: on-failure:3
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FILE: 'false' # containers log to stdout; wins over .env
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      # The slim image has no curl/wget, so use node's built-in fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
